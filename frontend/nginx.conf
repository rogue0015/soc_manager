# Serves the UI and bridges /api to FastAPI. The browser only ever talks to
# this server, so the API is same-origin and needs no CORS.
# See docs/decisions/0002-docker.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Look the backend up at request time (Docker's DNS), so nginx starts even
    # if the backend is down and follows it if its container IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # No build step means no hashed file names: always revalidate.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        client_max_body_size 10m;   # image and analytics uploads (the API caps them at 8 MB)
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # a blog sync fetches every post page
        error_page 502 504 = @backend_down;
    }

    # Interactive API docs from FastAPI.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        error_page 502 504 = @backend_down;
    }

    # The UI shows `detail` to the user, so say what is wrong in plain words.
    location @backend_down {
        default_type application/json;
        return 503 '{"detail":"The backend is not responding. Check that the backend container is running (docker compose ps)."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
